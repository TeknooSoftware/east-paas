paas:
  version: v1.1

pods:
  php-pods:
    replicas: 2
    containers:
      php-run:
        image: registry.teknoo.software/php-run
        version: 7.4
        listen:
          - 8080
          - 9000
          - 8443
        variables:
          FOO: bar
      sidecar:
        image: registry.hub.docker.com/library/busybox
        version: stable
        listen:
          - 8181
  demo:
    replicas: 1
    containers:
      nginx:
        image: registry.hub.docker.com/library/nginx
        version: alpine
        listen:
          - 8080
          - 8181
        healthcheck:
          initial-delay-seconds: 10
          period-seconds: 30
          probe:
            http:
              port: 8080
              path: '/status'

services:
  php-pods-php-run:
    pod: php-pods
    internal: false
    protocol: HTTPS
    ports:
      - listen: 9876
        target: 8080
      - listen: 9443
        target: 8443
  php-pods-php-run-2:
    pod: php-pods
    protocol: TCP
    ports:
      - listen: 9000
        target: 9000
  php-pods-sidecar:
    pod: php-pods
    ports:
      - listen: 8181
        target: 8181
  demo-nginx:
    pod: demo
    ports:
      - listen: 8080
        target: 8080
      - listen: 8181
        target: 8181
  legacy:
    pod: demo
    internal: false
    ports:
      - listen: 80
        target: 8080
      - listen: 443
        target: 8080

ingresses:
  demo-nginx:
    host: demo-paas.teknoo.software
    tls:
      secret: demo-vault
    service:
      name: demo-nginx
      port: 8080
    meta:
      letsencrypt: true
      annotations:
        foo: bar
    aliases:
      - alias1.demo-paas.teknoo.software
      - alias2.demo-paas.teknoo.software
    paths:
      - path: /php
        service:
          name: php-pods-php-run
          port: 9876
  legacy:
    host: legacy.teknoo.software
    https-backend: true
    tls:
      secret: demo-vault
    service:
      name: legacy
      port: 443
  demo-secure:
    host: demo-secure.teknoo.software
    https-backend: true
    tls:
      secret: demo-vault
    service:
      name: demo-nginx
      port: 8181
