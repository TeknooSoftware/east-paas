services:
    extra-foobarproject-volume-init:
        image: foo.bar/extra-foobarproject
        environment:
            MOUNT_PATH: /opt/extra
        volumes:
            - 'extra-foobarproject-volume:/opt/extra'
        network_mode: none
        restart: 'no'
    php-pods:
        image: 'foo.bar/php-run:7.4-09597-1e225-prod'
        networks:
            behat-test-foobarproject-private:
                aliases:
                    - php-service
        expose:
            - 8080
        env_file:
            - ./secrets/php-pods-php-run.env
        environment:
            SERVER_SCRIPT: /opt/app/src/server.php
        volumes:
            - 'extra-foobarproject-volume:/opt/extra:ro'
            - 'data-09597-1e225:/opt/data'
            - 'data-replicated:/opt/data-replicated'
        secrets:
            -
                source: volume-vault-secret-foo
                target: /vault/foo
            -
                source: volume-vault-secret-bar
                target: /vault/bar
        configs:
            -
                source: map2-map-foo
                target: /map/foo
            -
                source: map2-map-bar
                target: /map/bar
        depends_on:
            extra-foobarproject-volume-init:
                condition: service_completed_successfully
        healthcheck:
            test:
                - CMD-SHELL
                - 'ps aux php'
            start_period: 10s
            interval: 30s
            timeout: 5s
            retries: 1
        deploy:
            resources:
                reservations:
                    cpus: '0.068'
                    memory: 9.600M
                limits:
                    cpus: '0.561'
                    memory: 80M
            replicas: 2
    shell:
        image: 'registry.hub.docker.com/bash:alpine'
        networks:
            - behat-test-foobarproject-private
        deploy:
            resources:
                reservations:
                    cpus: '0.1'
                    memory: 9.600M
                limits:
                    cpus: '0.1'
                    memory: 80M
    demo:
        image: 'foo.bar/nginx:alpine-2a975-5be1e-prod'
        networks:
            - behat-test-foobarproject-private
        expose:
            - 8080
            - 8181
        healthcheck:
            test:
                - CMD-SHELL
                - 'curl -fk https://localhost:8080/status || exit 1'
            start_period: 10s
            interval: 30s
            timeout: 5s
            retries: 2
        deploy:
            resources:
                reservations:
                    cpus: '0.068'
                    memory: 9.600M
                limits:
                    cpus: '0.561'
                    memory: 80M
        group_add:
            - '1000'
    demo-waf:
        image: 'registry.hub.docker.com/library/waf:alpine'
        healthcheck:
            test:
                - CMD-SHELL
                - 'nc -z localhost 8181 || exit 1'
            start_period: 10s
            interval: 30s
            timeout: 5s
            retries: 1
        deploy:
            resources:
                reservations:
                    cpus: '0.1'
                    memory: 64M
                limits:
                    cpus: '0.1'
                    memory: 64M
        group_add:
            - '1000'
        network_mode: 'service:demo'
    demo-blackfire:
        image: 'blackfire/blackfire:2-prod'
        environment:
            BLACKFIRE_SERVER_ID: foo
            BLACKFIRE_SERVER_TOKEN: bar
        deploy:
            resources:
                reservations:
                    cpus: '0.1'
                    memory: 128M
                limits:
                    cpus: '0.1'
                    memory: 128M
        group_add:
            - '1000'
        network_mode: 'service:demo'
networks:
    behat-test-foobarproject-private:
        name: behat-test-foobarproject-private
        driver: bridge
volumes:
    data-09597-1e225:
        driver: local
    data-replicated:
        driver: local
    extra-foobarproject-volume:
        driver: local
configs:
    map1-map-key1:
        file: ./configs/map1-map/key1
    map1-map-key2:
        file: ./configs/map1-map/key2
    map2-map-foo:
        file: ./configs/map2-map/foo
    map2-map-bar:
        file: ./configs/map2-map/bar
secrets:
    map-vault-secret-key1:
        file: ./secrets/map-vault-secret/key1
    map-vault-secret-key2:
        file: ./secrets/map-vault-secret/key2
    map-vault2-secret-hello:
        file: ./secrets/map-vault2-secret/hello
    volume-vault-secret-foo:
        file: ./secrets/volume-vault-secret/foo
    volume-vault-secret-bar:
        file: ./secrets/volume-vault-secret/bar
