services:
    database:
        image: 'registry.hub.docker.com/library/mariadb:11'
        networks:
            - behat-test-foobarproject-private
        expose:
            - 3306
        volumes:
            - 'database-data:/var/lib/mysql'
    database-exporter:
        image: 'registry.hub.docker.com/library/exporter:1'
        volumes:
            - 'database-data:/data'
        network_mode: 'service:database'
    backup-dump:
        image: 'registry.hub.docker.com/library/alpine:3.20'
        networks:
            - behat-test-foobarproject-private
        volumes:
            - 'database-data:/backup/data'
        profiles:
            - scheduled
        restart: 'no'
        x-paas-job:
            parallel: false
            completions: 1
        x-paas-schedule:
            schedule: '17 3 * * *'
            time_zone: Europe/Paris
            concurrency: forbid
            suspend: false
            starting_deadline: 300
            successful_history: 3
            failed_history: 1
networks:
    behat-test-foobarproject-private:
        name: behat-test-foobarproject-private
        driver: bridge
volumes:
    database-data:
        driver: local
