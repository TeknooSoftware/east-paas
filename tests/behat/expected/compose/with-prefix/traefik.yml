http:
    routers:
        behat-test-a-prefix-foobarproject-demo:
            rule: 'Host(`demo-paas.teknoo.software`) || Host(`alias1.demo-paas.teknoo.software`) || Host(`alias2.demo-paas.teknoo.software`)'
            entryPoints:
                - websecure
            service: behat-test-a-prefix-foobarproject-demo-default
            tls: {  }
        behat-test-a-prefix-foobarproject-demo-php-service-9876:
            rule: '(Host(`demo-paas.teknoo.software`) || Host(`alias1.demo-paas.teknoo.software`) || Host(`alias2.demo-paas.teknoo.software`)) && PathPrefix(`/php`)'
            entryPoints:
                - websecure
            service: behat-test-a-prefix-foobarproject-demo-php-service-9876
            tls: {  }
        behat-test-a-prefix-foobarproject-demo-secure:
            rule: Host(`demo-secure.teknoo.software`)
            entryPoints:
                - websecure
            service: behat-test-a-prefix-foobarproject-demo-secure-default
            tls: {  }
    services:
        behat-test-a-prefix-foobarproject-demo-default:
            loadBalancer:
                servers:
                    -
                        url: 'http://demo.behat-test-a-prefix-foobarproject-private:8080'
        behat-test-a-prefix-foobarproject-demo-php-service-9876:
            loadBalancer:
                servers:
                    -
                        url: 'http://php-pods.behat-test-a-prefix-foobarproject-private:8080'
        behat-test-a-prefix-foobarproject-demo-secure-default:
            loadBalancer:
                servers:
                    -
                        url: 'https://demo.behat-test-a-prefix-foobarproject-private:8181'
